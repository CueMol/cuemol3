name: Build (Linux)

on:
  push:
#    branches-ignore:
#      - '**'
  workflow_dispatch:

# Cancel a superseded in-progress run on the same ref and event (see build2.yml
# for the rationale behind including event_name in the key).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Builds that nothing needs are skipped step by step, not by job.
# build_scripts/ci_needs_build.sh decides (output `build`: "false" only when a
# feature branch changed nothing but docs-like files; develop, tags and
# manual runs always build). The required status checks are these jobs'
# names, and a skipped matrix job reports an unexpanded name, so every job
# still runs and each step after checkout carries
#   if: needs.changes.outputs.build != 'false'
# A NEW STEP MUST CARRY IT TOO: one left without it runs on a skipped build
# and fails when it needs what the build makes (ctest, packaging, upload),
# which turns the required check red for a docs-only PR. Gate on != 'false'
# (never == 'true'), so a missing or misspelt output builds.

###############################################

jobs:
  # Whether this run builds (see the top). build2.yml decides the same in
  # setup_matrix; a job of another workflow cannot be a need.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          lfs: false

      - name: Decide whether to build
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: echo "build=$(bash build_scripts/ci_needs_build.sh)" >> "$GITHUB_OUTPUT"

  build_posix:
    name: '${{ matrix.name }}'
    needs: changes
    runs-on: ${{ matrix.os }}
    # Package tritium only on the release cadence (develop / tags / manual
    # dispatch), not on every feature-branch push. Core build + tests run always.
    env:
      DO_PACKAGE: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
      # Ship the umbreon (Embree) ray-tracing backend. Injected here rather than
      # flipped in build_libcuemol2_posix/run.sh because src/cmake/umbreon.cmake
      # does find_package(umbreon CONFIG REQUIRED): a default of ON would break
      # configure for any local checkout that has not run `task install_umbreon`.
      ENABLE_UMBREON: "ON"
      # Ship the MeshMS SES surface backend (same opt-in rationale as umbreon:
      # src/cmake/meshms.cmake does find_package(MeshMS CONFIG REQUIRED)).
      ENABLE_MESHMS: "ON"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: "Ubuntu 22 x64"

    steps:
    - uses: actions/checkout@v4
      with:
        # Do NOT fetch Git LFS objects: the repo is over its LFS budget, so an
        # LFS fetch fails the checkout. The only LFS files are two pytest
        # fixtures whose tests self-skip when the data is absent (conftest.py).
        lfs: false

    - name: Build skipped (only docs-like files changed)
      if: needs.changes.outputs.build == 'false'
      shell: bash
      run: echo "Nothing in this branch needs a build (build_scripts/ci_needs_build.sh); the build steps are skipped."

    - name: Run sccache-cache
      if: needs.changes.outputs.build != 'false'
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Setup Python
      if: needs.changes.outputs.build != 'false'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Node.js
      if: needs.changes.outputs.build != 'false'
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Enable pnpm via corepack
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: corepack enable

    - name: Show build env versions
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: |
        set -eux
        echo "RUNNER_TYPE=${{ matrix.os }}" >> $GITHUB_ENV
        uname -a
        gcc --version
        python3 --version
        python3 -m pip --version
        ninja --version

    - name: Download deplibs
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/download_deplibs
      with:
        basedir: ${{ github.workspace }}/target

    # umbreon is built from source (CueMol/umbreon at UMBREON_GIT_REF); Embree /
    # TBB / OIDN come prebuilt in the deplibs bundle. libcuemol2 then links it
    # via find_package(umbreon), resolving those deps to the same bundled copies.
    - name: Read umbreon git ref
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: |
        . build_scripts/deplibs.env
        echo "UMBREON_GIT_REF=$UMBREON_GIT_REF" >> $GITHUB_ENV

    - name: Build+install umbreon
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/build_umbreon_posix
      with:
        basedir: ${{ github.workspace }}/target
        ref: ${{ env.UMBREON_GIT_REF }}

    # MeshMS is built from source (CueMol/MeshMS at MESHMS_GIT_REF); its only
    # dependency, oneTBB, comes prebuilt in the deplibs bundle. libcuemol2 then
    # links it via find_package(MeshMS), resolving TBB to the same bundled copy.
    - name: Read meshms git ref
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: |
        . build_scripts/deplibs.env
        echo "MESHMS_GIT_REF=$MESHMS_GIT_REF" >> $GITHUB_ENV

    - name: Build+install MeshMS
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/build_meshms_posix
      with:
        basedir: ${{ github.workspace }}/target
        ref: ${{ env.MESHMS_GIT_REF }}

    - name: Build libcuemol2
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/build_libcuemol2_posix
      with:
        basedir: ${{ github.workspace }}/target
        
    - name: Run gtest
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: |
        set -eux
        ctest --test-dir ${{ github.workspace }}/target/build_libcuemol2 --output-on-failure

    # This job builds with ENABLE_MESHMS=ON, so the run above covers only the
    # MeshMS SES path. BALL stays compiled in as its fallback, so re-run the
    # backend-independent surface contract against it (one env var, ~1 s) to
    # keep the fallback from rotting.
    - name: Run gtest (BALL SES backend)
      if: needs.changes.outputs.build != 'false'
      shell: bash
      env:
        CUEMOL_SES_BACKEND: ball
      run: |
        set -eux
        ctest --test-dir ${{ github.workspace }}/target/build_libcuemol2 \
              --output-on-failure -L test_surface

    - name: Build python module
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/build_pymod_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Build tritium/core addon
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/build_tritium_core_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Test tritium/core addon
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/test_tritium_core_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Check tritium/react-gui
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/check_tritium_react_gui

    - name: Build cuetty
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/build_cuetty_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Check cuetty run
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: |
        set -eux
        BASEDIR=${{ github.workspace }}/target
        ls -la $BASEDIR/cuemol2/bin/cuetty
        ldd $BASEDIR/cuemol2/bin/cuetty
        env LD_LIBRARY_PATH=$BASEDIR/cuemol2/lib $BASEDIR/cuemol2/bin/cuetty

    - name: Get version
      id: version
      if: needs.changes.outputs.build != 'false' && (env.DO_PACKAGE == 'true')
      shell: bash
      run: |
        VERSION=$(grep '#define QM_VERSION' src/_version.h | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # Package the tritium Electron app (Linux x64 AppImage + deb, unsigned).
    # Release cadence only (develop / workflow_dispatch / tags); see DO_PACKAGE.
    - name: Install AppImage build deps
      if: needs.changes.outputs.build != 'false' && (env.DO_PACKAGE == 'true')
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libfuse2

    - name: Package tritium (Linux x64 AppImage + deb)
      if: needs.changes.outputs.build != 'false' && (env.DO_PACKAGE == 'true')
      shell: bash
      run: |
        set -eux
        export LIBCUEMOL2_ROOT=${{ github.workspace }}/target/cuemol2
        bash tritium/packaging/package.sh --linux --x64

    - name: Upload tritium Linux artifacts
      if: needs.changes.outputs.build != 'false' && (env.DO_PACKAGE == 'true')
      uses: actions/upload-artifact@v4
      with:
        name: CueMol3_${{ steps.version.outputs.version }}_linux_x64
        path: |
          tritium/react-gui/release/*.AppImage
          tritium/react-gui/release/*.deb
        if-no-files-found: error

    # On a tag, attach the Linux artifacts to the GitHub release for the same
    # tag -- creating it if this job wins the race against build2.yml's
    # release_build.
    #
    # Deliberately passes no `body`: the action retains existing release info
    # for keys the caller leaves unset, so this step can never overwrite the
    # notes build2.yml generates, whichever workflow gets there first.
    - name: Attach Linux artifacts to release
      if: needs.changes.outputs.build != 'false' && (startsWith(github.ref, 'refs/tags/'))
      uses: softprops/action-gh-release@v2
      with:
        files: |
          tritium/react-gui/release/*.AppImage
          tritium/react-gui/release/*.deb

  # Portable cuetty for headless Linux nodes (RHEL 8 class and later): built in
  # the manylinux_2_28 container (glibc 2.28, gcc-toolset) against the manylinux
  # deplibs bundle, then packaged as cuetty-<version>-linux-x64.tar.gz. Only
  # libcuemol2 and cuetty are built (CUEMOL2_CLI_ONLY): no Python / node.js
  # bindings and no tests, which the Ubuntu job above covers.
  cuetty_portable:
    name: 'cuetty portable (manylinux_2_28 x64)'
    needs: changes
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      ENABLE_UMBREON: "ON"
      # MeshMS must be on here too: run.sh defaults it to OFF, and the Ubuntu
      # job's setting is that job's env. Without it surfaces fall back to BALL
      # and differ from what the GUI builds.
      ENABLE_MESHMS: "ON"
      CUEMOL2_CLI_ONLY: "ON"
      DEPLIBS_FLAVOR: manylinux
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false

    - name: Build skipped (only docs-like files changed)
      if: needs.changes.outputs.build == 'false'
      shell: bash
      run: echo "Nothing in this branch needs a build (build_scripts/ci_needs_build.sh); the build steps are skipped."

    # EL8 ships bison 3.0.4 and flex 2.6.1, below what libcuemol2 requires
    # (3.7.4 / 2.6.4); both are only used to generate parsers at build time, so
    # they are built here and never shipped.
    - name: Install prerequisites
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: |
        set -eux
        dnf install -y wget bzip2 xz xz-devel perl m4
        command -v ninja || pipx install ninja
        command -v cmake || pipx install cmake
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # libcuemol2's configure needs a Python >= 3.8 interpreter (code
        # generation); the image's own python3 is older.
        echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
        cd /tmp
        curl -fsSL --retry 3 -o bison.tar.xz https://ftpmirror.gnu.org/gnu/bison/bison-3.8.2.tar.xz
        tar xJf bison.tar.xz
        (cd bison-3.8.2 && ./configure --prefix=/usr/local && make -j4 && make install)
        curl -fsSL --retry 3 -o flex.tar.gz https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz
        tar xzf flex.tar.gz
        # _GNU_SOURCE: glibc 2.28 declares reallocarray() only with it, and
        # gcc 14 rejects flex's implicit declaration.
        (cd flex-2.6.4 && CFLAGS="-O2 -D_GNU_SOURCE" ./configure --prefix=/usr/local && make -j4 && make install)
        gcc --version
        cmake --version
        bison --version
        flex --version

    - name: Download deplibs (manylinux)
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: bash build_scripts/download_deplibs/run.sh "$GITHUB_WORKSPACE/target" Linux X64

    - name: Read umbreon / MeshMS git refs
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: |
        . build_scripts/deplibs.env
        echo "UMBREON_GIT_REF=$UMBREON_GIT_REF" >> $GITHUB_ENV
        echo "MESHMS_GIT_REF=$MESHMS_GIT_REF" >> $GITHUB_ENV

    - name: Build+install umbreon
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/build_umbreon_posix
      with:
        basedir: ${{ github.workspace }}/target
        ref: ${{ env.UMBREON_GIT_REF }}

    - name: Build+install MeshMS
      if: needs.changes.outputs.build != 'false'
      uses: ./build_scripts/build_meshms_posix
      with:
        basedir: ${{ github.workspace }}/target
        ref: ${{ env.MESHMS_GIT_REF }}

    - name: Build libcuemol2 and cuetty
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: |
        set -eux
        bash build_scripts/build_libcuemol2_posix/run.sh "$GITHUB_WORKSPACE/target"
        bash build_scripts/build_cuetty_posix/run.sh "$GITHUB_WORKSPACE/target"
        ldd "$GITHUB_WORKSPACE/target/cuemol2/bin/cuetty"

    - name: Package
      id: package
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: |
        set -eux
        VERSION=$(grep '#define QM_VERSION' src/_version.h | sed 's/.*"\(.*\)".*/\1/')
        bash build_scripts/package_cuetty_linux.sh "$GITHUB_WORKSPACE/target/cuemol2" "$GITHUB_WORKSPACE/dist" "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Upload cuetty tarball
      if: needs.changes.outputs.build != 'false'
      uses: actions/upload-artifact@v4
      with:
        name: cuetty_${{ steps.package.outputs.version }}_linux_x64
        path: dist/cuetty-*-linux-x64.tar.gz
        if-no-files-found: error

  # Run the unpacked tarball on plain distribution images, with no
  # LD_LIBRARY_PATH: the oldest target (Rocky 8, glibc 2.28) and an Ubuntu.
  cuetty_portable_check:
    name: 'cuetty portable check (${{ matrix.image }})'
    needs: [changes, cuetty_portable]
    runs-on: ubuntu-22.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux:8", "ubuntu:22.04"]
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false

    - name: Download cuetty tarball
      if: needs.changes.outputs.build != 'false'
      uses: actions/download-artifact@v4
      with:
        pattern: cuetty_*_linux_x64
        path: dist
        merge-multiple: true

    - name: Render a still and a two-shard movie
      if: needs.changes.outputs.build != 'false'
      shell: bash
      run: |
        set -eux
        bash build_scripts/check_cuetty_portable.sh dist/cuetty-*-linux-x64.tar.gz \
            "$GITHUB_WORKSPACE/tests/test_data/1crn_movie_test.qsc"

  # On a tag, attach the checked tarball to the release (see the tritium
  # step above for why no body is passed).
  cuetty_portable_release:
    name: 'cuetty portable release'
    if: startsWith(github.ref, 'refs/tags/')
    needs: [changes, cuetty_portable_check]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Download cuetty tarball
      uses: actions/download-artifact@v4
      with:
        pattern: cuetty_*_linux_x64
        path: dist
        merge-multiple: true

    - name: Attach to release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/cuetty-*-linux-x64.tar.gz
